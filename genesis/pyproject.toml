[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-assistant"
version = "1.0.0"
description = "GENESIS — Intelligent Desktop AI Assistant (conversational AI + agentic desktop automation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Genesis Team" }]
dependencies = [
  "PySide6>=6.6,<7", "requests>=2.31", "python-dotenv>=1.0", "numpy>=1.26", "scikit-learn>=1.3", "psutil>=5.9",
  "dateparser>=1.2", "cryptography>=42", "keyring>=24", "send2trash>=1.8", "pypdf>=4.0", "pyflakes>=3.1",
  "sounddevice>=0.4.6", "vosk>=0.3.45", "faster-whisper>=1.0.0", "pyttsx3>=2.90", "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.7"]
browser = ["playwright>=1.44"]
search = ["ddgs>=9.0"]
docs = ["python-docx>=1.1"]
porcupine = ["pvporcupine>=3.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "pyinstaller>=6.6"]

[project.scripts]
genesis = "genesis.__main__:main"

[project.gui-scripts]
genesis-desktop = "genesis.ui.app:run"

[tool.setuptools.packages.find]
include = ["genesis*"]

[tool.setuptools.package-data]
"genesis.nlp" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = ["B008", "B027", "B904", "B905"]
